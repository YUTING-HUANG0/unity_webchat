<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>智能知識助手系統</title>
    <style>
        :root {
            --bg-pure: #0d1419;
            --bg-radial: #16242f;
            --box-bg: rgba(32, 48, 60, 0.7);
            /* 更亮的區塊底色 */
            --box-border: rgba(75, 140, 160, 0.5);
            /* 邊框變明顯一點 */
            --corner-color: #5ed1d1;

            --user-bg: rgba(45, 80, 95, 0.8);
            /* 使用者訊息的獨立底色 (稍偏明亮的藍綠) */
            --user-border: rgba(90, 175, 195, 0.6);

            --text-main: #d0e5e5;
            --text-dim: #8baaaa;
            --accent: #66caca;
        }

        body,
        html {
            padding: 0;
            margin: 0;
            height: 100vh;
            width: 100vw;
            background: var(--bg-pure);
            font-family: "Microsoft JhengHei", sans-serif;
            color: var(--text-main);
            overflow: hidden;
        }

        #unity-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 1px !important;
            height: 1px !important;
            opacity: 0;
            z-index: 1;
        }

        #web-ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            display: flex;
            flex-direction: column;
            background: radial-gradient(circle at center, var(--bg-radial) 0%, var(--bg-pure) 100%);
        }

        .cyber-box {
            position: relative;
            background: var(--box-bg);
            border: 1px solid var(--box-border);
            padding: 1.5rem;
        }

        .cyber-box::before {
            content: '';
            position: absolute;
            top: -1px;
            left: -1px;
            right: -1px;
            bottom: -1px;
            pointer-events: none;
            background:
                linear-gradient(to right, var(--corner-color), var(--corner-color)) top left / 10px 2px no-repeat,
                linear-gradient(to bottom, var(--corner-color), var(--corner-color)) top left / 2px 10px no-repeat,
                linear-gradient(to left, var(--corner-color), var(--corner-color)) top right / 10px 2px no-repeat,
                linear-gradient(to bottom, var(--corner-color), var(--corner-color)) top right / 2px 10px no-repeat,
                linear-gradient(to right, var(--corner-color), var(--corner-color)) bottom left / 10px 2px no-repeat,
                linear-gradient(to top, var(--corner-color), var(--corner-color)) bottom left / 2px 10px no-repeat,
                linear-gradient(to left, var(--corner-color), var(--corner-color)) bottom right / 10px 2px no-repeat,
                linear-gradient(to top, var(--corner-color), var(--corner-color)) bottom right / 2px 10px no-repeat;
        }

        #header-container {
            display: flex;
            justify-content: center;
            padding-top: 2rem;
            margin-bottom: 0.5rem;
        }

        #header {
            font-size: 1.5rem;
            letter-spacing: 4px;
            color: var(--text-main);
            padding: 0.8rem 2.5rem;
        }

        #chat-window {
            flex: 1;
            overflow-y: auto;
            padding: 1rem 3rem;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            max-width: 900px;
            margin: 0 auto;
            width: 100%;
            box-sizing: border-box;
        }

        .message {
            max-width: 85%;
            line-height: 1.6;
            font-size: 1rem;
            word-break: break-all;
            white-space: pre-wrap;
        }

        .bot-msg {
            align-self: flex-start;
        }

        .user-msg {
            align-self: flex-end;
            background: var(--user-bg);
            border-color: var(--user-border);
        }

        .suggestion-box {
            margin-top: 1rem;
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
        }

        .suggestion-btn {
            background: rgba(20, 35, 45, 0.6);
            border: 1px solid var(--box-border);
            color: var(--text-main);
            padding: 0.8rem 1.2rem;
            text-align: left;
            cursor: pointer;
            font-size: 0.95rem;
            border-radius: 6px;
            transition: all 0.2s;
            display: block;
            width: 100%;
            white-space: normal;
        }

        .suggestion-btn:hover {
            background: rgba(80, 160, 180, 0.3);
            border-color: var(--corner-color);
        }

        #input-area {
            padding: 1.5rem 2rem;
            margin-bottom: 1rem;
        }

        .input-container {
            max-width: 900px;
            margin: 0 auto;
            display: flex;
            gap: 1rem;
            align-items: stretch;
        }

        .input-wrapper {
            flex: 1;
            display: flex;
            padding: 0;
        }

        input {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-main);
            padding: 0.8rem 1.2rem;
            outline: none;
            font-size: 1rem;
        }

        .btn {
            padding: 0.8rem 1.5rem;
            cursor: pointer;
            font-size: 1rem;
            background: rgba(25, 40, 50, 0.7);
            border: 1px solid rgba(75, 140, 160, 0.5);
            color: var(--text-dim);
            transition: 0.2s;
            letter-spacing: 1px;
            border-radius: 6px;
        }

        .btn:hover {
            background: rgba(80, 160, 180, 0.4);
            color: var(--text-main);
            border-color: var(--corner-color);
        }

        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.2);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--box-border);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--corner-color);
        }

        /* 新增：機器人思考中動畫 */
        @keyframes pulse {
            0% {
                opacity: 0.5;
            }

            50% {
                opacity: 1;
            }

            100% {
                opacity: 0.5;
            }
        }

        #typing-indicator {
            animation: pulse 1.5s infinite ease-in-out;
            color: var(--accent);
            /* 使用亮色，更顯眼 */
            font-weight: bold;
        }

        #loading-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--bg-pure);
            z-index: 100;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: opacity 0.5s;
        }

        .loader {
            width: 48px;
            height: 48px;
            border: 5px solid var(--text-dim);
            border-bottom-color: var(--accent);
            border-radius: 50%;
            display: inline-block;
            box-sizing: border-box;
            animation: rotation 1s linear infinite;
            margin-bottom: 1rem;
        }

        @keyframes rotation {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        #loading-text {
            color: var(--accent);
            font-size: 1.2rem;
            letter-spacing: 2px;
        }
    </style>
</head>

<body>
    <div id="loading-overlay">
        <span class="loader"></span>
        <div id="loading-text">系統載入中... 0%</div>
    </div>
    <canvas id="unity-canvas"></canvas>
    <div id="web-ui-layer">
        <div id="header-container">
            <div id="header" class="cyber-box">智能知識助手系統</div>
        </div>
        <div id="chat-window">
            <div class="message bot-msg cyber-box">系統已就緒，您可以點擊下方預設問題，或直接輸入。
                <div class="suggestion-box">
                    <button id="s-btn-1" class="suggestion-btn" onclick="askSuggestion('什麼是生成式AI ( Generative AI ) ？')"
                        disabled>1. 什麼是生成式AI ( Generative AI ) ？</button>
                    <button id="s-btn-2" class="suggestion-btn" onclick="askSuggestion('TAM 的兩個核心概念是什麼？')" disabled>2.
                        TAM 的兩個核心概念是什麼？</button>
                </div>
            </div>
        </div>
        <div id="input-area">
            <div class="input-container">
                <button id="clear-btn" class="btn" onclick="clearConversation()" disabled>清空對話</button>
                <div class="input-wrapper cyber-box">
                    <input type="text" id="userInput" placeholder="請輸入您的問題..." disabled>
                </div>
                <button id="send-btn" class="btn" onclick="performSend()" disabled>傳送</button>
            </div>
        </div>
    </div>

    <script>
        function applyTheme() {
            const urlParams = new URLSearchParams(window.location.search);
            const theme = urlParams.get('theme');
            if (theme) document.documentElement.setAttribute('data-theme', theme);
        }
        applyTheme();

        var unityInstance = null;
        var canvas = document.querySelector("#unity-canvas");
        var config = {
            dataUrl: "Build/knowledge-agent-api.data",
            frameworkUrl: "Build/knowledge-agent-api.framework.js",
            codeUrl: "Build/knowledge-agent-api.wasm",
            streamingAssetsUrl: "StreamingAssets",
            companyName: "DefaultCompany",
            productName: "AgentKnowledgeTest",
            productVersion: "1.0",
        };

        var script = document.createElement("script");
        script.src = "Build/knowledge-agent-api.loader.js";
        script.onload = () => {
            const loadingText = document.getElementById('loading-text');
            createUnityInstance(canvas, config, (progress) => {
                loadingText.innerText = `系統載入中... ${Math.round(progress * 100)}%`;
            }).then((instance) => {
                unityInstance = instance;
                instance.SendMessage('_Managers', 'SetCaptureAllKeyboardInput', 0);
                setTimeout(() => {
                    document.getElementById('loading-overlay').style.opacity = '0';
                    setTimeout(() => {
                        document.getElementById('loading-overlay').style.display = 'none';
                        enableUI(true);
                    }, 500);
                }, 500);
            }).catch((err) => {
                loadingText.innerText = "載入失敗，請檢查網路連線或重新整理頁面。";
                console.error(err);
            });
        };
        document.body.appendChild(script);

        function enableUI(enabled) {
            document.getElementById('userInput').disabled = !enabled;
            document.getElementById('send-btn').disabled = !enabled;
            document.getElementById('clear-btn').disabled = !enabled;
            document.getElementById('s-btn-1').disabled = !enabled;
            document.getElementById('s-btn-2').disabled = !enabled;
            if (enabled) document.getElementById('userInput').placeholder = "請輸入您的問題...";
        }

        function performSend() {
            const input = document.getElementById('userInput');
            const text = input.value.trim();
            if (!text) return;
            if (!unityInstance) {
                alert("系統初始化中，請稍候...");
                return;
            }
            appendMsg('user', text);
            input.value = '';
            showTyping(true);
            // 使用 setTimeout(0) 確保「思考中」的 DOM 更新能先被瀏覽器渲染繪製
            setTimeout(() => {
                unityInstance.SendMessage('_Managers', 'GetMessageFromHTML', text);
            }, 50);
        }

        document.getElementById('userInput').addEventListener('keypress', (e) => { if (e.key === 'Enter') performSend(); });

        function askSuggestion(text) {
            if (!unityInstance) {
                alert("系統初始化中，請稍候...");
                return;
            }
            appendMsg('user', text);
            showTyping(true);
            // 同樣確保 DOM 更新渲染
            setTimeout(() => {
                unityInstance.SendMessage('_Managers', 'GetMessageFromHTML', text);
            }, 50);
        }

        function clearConversation() {
            if (confirm("確定要清空嗎？")) {
                if (unityInstance) unityInstance.SendMessage('_Managers', 'ClearChat');
                location.reload();
            }
        }

        function appendMsg(role, text) {
            if (text === "UNITY_READY") return;
            const win = document.getElementById('chat-window');
            const div = document.createElement('div');
            div.className = `message ${role}-msg cyber-box`;
            div.innerText = text;
            win.appendChild(div);
            win.scrollTop = win.scrollHeight;
        }

        let typingTimer = null;
        let dotCount = 0;
        let dotTimer = null;

        function showTyping(isTyping) {
            const win = document.getElementById('chat-window');
            let typingDiv = document.getElementById('typing-indicator');

            if (isTyping) {
                if (!typingDiv) {
                    typingDiv = document.createElement('div');
                    typingDiv.id = 'typing-indicator';
                    typingDiv.className = 'message bot-msg cyber-box';
                    win.appendChild(typingDiv);
                }

                // 確保文字正確並將元素移到最下方
                typingDiv.innerText = '機器人正在思考...';
                win.appendChild(typingDiv);
                typingDiv.style.display = 'block';

                // 動態點點效果
                if (dotTimer) clearInterval(dotTimer);
                dotCount = 0;
                dotTimer = setInterval(() => {
                    dotCount = (dotCount + 1) % 4;
                    typingDiv.innerText = '機器人正在思考' + '.'.repeat(dotCount);
                }, 500);

                if (typingTimer) clearTimeout(typingTimer);

                // 設定 15 秒超時彈窗
                typingTimer = setTimeout(() => {
                    if (typingDiv.style.display === 'block') {
                        alert("偵測到回應時間較長，系統可能正在排隊或網路不穩，請再耐心等候幾秒或重新整理。");
                    }
                }, 15000);

            } else {
                if (typingTimer) clearTimeout(typingTimer);
                if (dotTimer) clearInterval(dotTimer);
                if (typingDiv) typingDiv.style.display = 'none';
            }
            win.scrollTop = win.scrollHeight;
            // 延遲一點點確保內容載入後滾動到底部
            setTimeout(() => { win.scrollTop = win.scrollHeight; }, 50);
        }

        window.dispatchAnswerToHTML = function (answer) {
            showTyping(false);
            appendMsg('bot', answer);
        };

        window.setTypingStatus = function (isTyping) {
            document.getElementById('send-btn').disabled = (isTyping === 1);
            showTyping(isTyping === 1);
        };
    </script>
</body>

</html>
