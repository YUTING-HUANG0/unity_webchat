<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>智能知識助手系統</title>
    <style>
        :root {
            --bg-pure: #121212;
            --bg-radial: #242424;
            --box-bg: rgba(40, 40, 40, 0.85);
            
            --box-border: rgba(120, 120, 120, 0.35);
            
            --corner-color: #b0b0b0;

            --user-bg: rgba(65, 65, 65, 0.85);
            
            --user-border: rgba(160, 160, 160, 0.45);

            --text-main: #dcdcdc;
            --text-dim: #999999;
            --accent: #cccccc;
        }

        body,
        html {
            padding: 0;
            margin: 0;
            height: 100vh;
            width: 100vw;
            background: #000;
            font-family: "DFKai-SB", "BiauKai", "標楷體", serif;
            color: var(--text-main);
            overflow: hidden;
        }

        input,
        button,
        textarea,
        select {
            font-family: inherit;
        }

        #unity-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 1px !important;
            height: 1px !important;
            opacity: 0;
            z-index: 1;
        }

        #web-ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            display: flex;
            flex-direction: column;
            background: rgba(0, 0, 0, 0.5);
        }

        #web-ui-layer::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 50vw;
            aspect-ratio: 1024 / 768;
            transform: translate(-50%, -50%);
            z-index: -1;
            background: url('background.jpg') no-repeat center center / cover;
            -webkit-mask-image: radial-gradient(ellipse at center, rgba(0, 0, 0, 1) 10%, rgba(0, 0, 0, 0) 70%);
            mask-image: radial-gradient(ellipse at center, rgba(0, 0, 0, 1) 10%, rgba(0, 0, 0, 0) 70%);
            pointer-events: none;
            display: none;
            
        }

        .cyber-box {
            position: relative;
            background: var(--box-bg);
            border: 1px solid var(--box-border);
            padding: 1.5rem;
        }

        .cyber-box::before {
            content: '';
            position: absolute;
            top: -1px;
            left: -1px;
            right: -1px;
            bottom: -1px;
            pointer-events: none;
            background:
                linear-gradient(to right, var(--corner-color), var(--corner-color)) top left / 10px 2px no-repeat,
                linear-gradient(to bottom, var(--corner-color), var(--corner-color)) top left / 2px 10px no-repeat,
                linear-gradient(to left, var(--corner-color), var(--corner-color)) top right / 10px 2px no-repeat,
                linear-gradient(to bottom, var(--corner-color), var(--corner-color)) top right / 2px 10px no-repeat,
                linear-gradient(to right, var(--corner-color), var(--corner-color)) bottom left / 10px 2px no-repeat,
                linear-gradient(to top, var(--corner-color), var(--corner-color)) bottom left / 2px 10px no-repeat,
                linear-gradient(to left, var(--corner-color), var(--corner-color)) bottom right / 10px 2px no-repeat,
                linear-gradient(to top, var(--corner-color), var(--corner-color)) bottom right / 2px 10px no-repeat;
        }

        #header-container {
            display: flex;
            justify-content: center;
            padding-top: 2rem;
            margin-bottom: 0.5rem;
        }

        #header {
            font-size: 1.5rem;
            letter-spacing: 4px;
            color: var(--text-main);
            padding: 0.8rem 2.5rem;
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        #header-mini-img {
            width: 60px;
            height: 60px;
            object-fit: contain;
            filter: drop-shadow(0 0 6px rgba(255, 255, 255, 0.15));
        }

        #main-content-container {
            display: flex;
            flex: 1;
            overflow: hidden;
            width: 100%;
            max-width: 1300px;
            margin: 0 auto;
            padding: 0 2rem 1.5rem 2rem;
            box-sizing: border-box;
            gap: 2rem;
        }

        #character-panel {
            display: none;
            
        }

        .character-wrapper {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            overflow: visible;
            
            position: relative;
            padding: 1rem;
            box-sizing: border-box;
        }

        #character-img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            filter: drop-shadow(0 0 12px rgba(255, 255, 255, 0.15));
            transition: all 0.3s ease;
            transform-origin: bottom center;
            transform: scaleX(-1.2) scaleY(1.2);
            
        }

        #character-img:hover {
            transform: scaleX(-1.25) scaleY(1.25);
            
            filter: drop-shadow(0 0 20px rgba(255, 255, 255, 0.3));
        }

        #chat-main-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-sizing: border-box;
        }

        #chat-window {
            flex: 1;
            overflow-y: auto;
            padding: 1rem 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            width: 100%;
            box-sizing: border-box;
        }

        .message {
            max-width: 85%;
            line-height: 1.6;
            font-size: 1rem;
            word-break: break-all;
            white-space: pre-wrap;
        }

        .bot-msg {
            align-self: flex-start;
            display: flex;
            gap: 1rem;
            align-items: flex-start;
        }

        .bot-text {
            flex: 1;
        }

        .avatar {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            overflow: hidden;
            position: relative;
            border: 2px solid var(--corner-color);
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.15);
            flex-shrink: 0;
        }

        .avatar-img {
            width: 140%;
            height: auto;
            position: absolute;
            left: -35%;
            top: -5%;
            transform: scaleX(-1);
            
        }

        .user-msg {
            align-self: flex-end;
            background: var(--user-bg);
            border-color: var(--user-border);
        }

        .suggestion-box {
            margin-top: 1rem;
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
        }

        .suggestion-btn {
            background: rgba(50, 50, 50, 0.6);
            border: 1px solid var(--box-border);
            color: var(--text-main);
            padding: 0.8rem 1.2rem;
            text-align: left;
            cursor: pointer;
            font-size: 0.95rem;
            border-radius: 6px;
            transition: all 0.2s;
            display: block;
            width: 100%;
            white-space: normal;
        }

        .suggestion-btn:hover {
            background: rgba(120, 120, 120, 0.3);
            border-color: var(--corner-color);
        }

        #input-area {
            padding: 1.5rem 0 0.5rem 0;
            margin-bottom: 0.5rem;
        }

        .input-container {
            width: 100%;
            display: flex;
            gap: 1rem;
            align-items: stretch;
        }

        .input-wrapper {
            flex: 1;
            display: flex;
            padding: 0;
        }

        input {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-main);
            padding: 0.8rem 1.2rem;
            outline: none;
            font-size: 1rem;
        }

        .btn {
            padding: 0.8rem 1.5rem;
            cursor: pointer;
            font-size: 1rem;
            background: rgba(50, 50, 50, 0.7);
            border: 1px solid var(--box-border);
            color: var(--text-dim);
            transition: 0.2s;
            letter-spacing: 1px;
            border-radius: 6px;
        }

        .btn:hover {
            background: rgba(120, 120, 120, 0.4);
            color: var(--text-main);
            border-color: var(--corner-color);
        }

        @media (max-width: 1000px) {
            #main-content-container {
                position: relative;
            }

            #character-panel {
                position: absolute;
                left: 2rem;
                
                bottom: 2rem;
                width: 280px;
                height: auto;
                max-height: 80%;
                z-index: 1;
                opacity: 0.5;
                pointer-events: none;
            }

            #chat-main-panel {
                position: relative;
                z-index: 2;
                width: 100%;
            }
        }

        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.2);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--box-border);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--corner-color);
        }

        
        @keyframes pulse {
            0% {
                opacity: 0.5;
            }

            50% {
                opacity: 1;
            }

            100% {
                opacity: 0.5;
            }
        }

        #typing-indicator {
            animation: pulse 1.5s infinite ease-in-out;
            color: var(--accent);
            
            font-weight: bold;
        }

        #loading-overlay {
            width: 100%;
            height: 42px;
            background: rgba(30, 30, 30, 0.95);
            border-bottom: 1px solid var(--box-border);
            z-index: 100;
            display: flex;
            flex-direction: row;
            justify-content: center;
            align-items: center;
            gap: 12px;
            transition: opacity 0.5s, height 0.5s;
            flex-shrink: 0;
            
        }

        .loader {
            width: 16px;
            height: 16px;
            border: 2px solid var(--text-dim);
            border-bottom-color: var(--accent);
            border-radius: 50%;
            display: inline-block;
            box-sizing: border-box;
            animation: rotation 1s linear infinite;
        }

        @keyframes rotation {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        #loading-text {
            color: var(--accent);
            font-size: 0.85rem;
            letter-spacing: 1px;
        }

        #fade-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            z-index: 99;
            pointer-events: none;
            opacity: 1;
            transition: opacity 0.5s ease;
        }

        
        #welcome-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #0d0d0d 0%, #1a1a1a 100%);
            z-index: 1000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 1s ease, visibility 1s ease;
        }

        #welcome-screen.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .welcome-character-wrapper {
            margin-bottom: 2rem;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 350px;
        }

        #welcome-character {
            height: 100%;
            object-fit: contain;
            filter: drop-shadow(0 0 15px rgba(255, 255, 255, 0.2));
            animation: welcome-breath 3s ease-in-out infinite alternate;
        }

        @keyframes welcome-breath {
            0% {
                transform: scale(1);
            }

            100% {
                transform: scale(1.03);
            }
        }

        .welcome-speech-bubble {
            position: relative;
            background: rgba(40, 40, 40, 0.9);
            border: 1px solid var(--box-border);
            border-radius: 12px;
            padding: 1.2rem 2rem;
            max-width: 500px;
            text-align: center;
            color: var(--text-main);
            font-size: 1.2rem;
            line-height: 1.6;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.5);
            min-height: 2.4rem;
            display: flex;
            align-items: center;
            justify-content: center;
            letter-spacing: 2px;
        }

        .welcome-speech-bubble::after {
            content: '';
            position: absolute;
            bottom: 100%;
            left: 50%;
            transform: translateX(-50%);
            border-width: 10px;
            border-style: solid;
            border-color: transparent transparent rgba(40, 40, 40, 0.9) transparent;
        }

        
        #character-img {
            opacity: 0;
            transition: opacity 0.15s ease;
        }

        .avatar-img {
            opacity: 0; 
        }

        #welcome-character {
            opacity: 0;
            transition: opacity 1s ease; 
        }
    </style>
</head>

<body>
    <div id="welcome-screen">
        <div class="welcome-character-wrapper">
            <img id="welcome-character" src="sherlock.png" alt="Sherlock Welcome" onload="removeCheckerboard(this)">
        </div>
        <div class="welcome-speech-bubble cyber-box">
            <span id="welcome-text">系統載入中...</span>
        </div>
    </div>
    <canvas id="unity-canvas"></canvas>
    <div id="web-ui-layer">
        <div id="fade-overlay"></div>
        <div id="loading-overlay">
            <span class="loader"></span>
            <div id="loading-text">3D 引擎載入中... 0% (已啟用極速 API 模式，您可以直接開始對話)</div>
        </div>
        <div id="header-container">
            <div id="header" class="cyber-box">
                <span>智能知識助手系統</span>
            </div>
        </div>
        <div id="main-content-container">
            
            <div id="chat-main-panel">
                <div id="chat-window">
                    <div class="message bot-msg cyber-box">
                        <div class="avatar"><img class="avatar-img" src="sherlock.png" onload="removeCheckerboard(this)"></div>
                        <div class="bot-text">系統已就緒，您可以點擊下方預設問題，或直接輸入。<div class="suggestion-box"><button id="s-btn-1" class="suggestion-btn" onclick="askSuggestion('什麼是生成式AI ( Generative AI ) ？')" disabled>1. 什麼是生成式AI ( Generative AI ) ？</button><button id="s-btn-2" class="suggestion-btn" onclick="askSuggestion('TAM 的兩個核心概念是什麼？')" disabled>2. TAM 的兩個核心概念是什麼？</button></div></div>
                    </div>
                </div>
                <div id="input-area">
                    <div class="input-container">
                        <button id="clear-btn" class="btn" onclick="clearConversation()" disabled>清空對話</button>
                        <div class="input-wrapper cyber-box">
                            <input type="text" id="userInput" placeholder="請輸入您的問題..." disabled>
                        </div>
                        <button id="send-btn" class="btn" onclick="performSend()" disabled>傳送</button>
                    </div>
                </div>
            </div>

            
            <div id="character-panel">
                <div class="character-wrapper">
                    <img src="sherlock.png" alt="Sherlock Holmes" id="character-img" onload="removeCheckerboard(this)">
                </div>
            </div>
        </div>
    </div>

    <script>
        let cachedTransparentSherlock = null; 

        function removeCheckerboard(img) {
            if (!img) return;

            
            if (img.dataset.transparentized === 'true') {
                img.style.opacity = '1';
                if (img.id === 'welcome-character' && window.startWelcomeDialogue) {
                    window.startWelcomeDialogue();
                    window.startWelcomeDialogue = null; 
                }
                return;
            }

            
            if (cachedTransparentSherlock && img.src !== cachedTransparentSherlock) {
                img.dataset.transparentized = 'true';
                img.src = cachedTransparentSherlock;
                img.style.opacity = '1';
                if (img.id === 'welcome-character' && window.startWelcomeDialogue) {
                    window.startWelcomeDialogue();
                    window.startWelcomeDialogue = null;
                }
                return;
            }

            
            if (!img.complete || img.naturalWidth === 0) {
                img.onload = () => removeCheckerboard(img);
                return;
            }

            img.dataset.transparentized = 'true';

            const canvas = document.createElement('canvas');
            canvas.width = img.naturalWidth;
            canvas.height = img.naturalHeight;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0);

            try {
                const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                const data = imgData.data;
                const width = canvas.width;
                const height = canvas.height;

                const visited = new Uint8Array(width * height);
                const queue = [];

                
                for (let x = 0; x < width; x++) {
                    queue.push(x, 0);
                    visited[x] = 1;
                    queue.push(x, height - 1);
                    visited[x + (height - 1) * width] = 1;
                }
                for (let y = 1; y < height - 1; y++) {
                    queue.push(0, y);
                    visited[y * width] = 1;
                    queue.push(width - 1, y);
                    visited[width - 1 + y * width] = 1;
                }

                
                function isBackground(r, g, b, a) {
                    if (a < 10) return true;

                    const maxVal = Math.max(r, g, b);
                    const minVal = Math.min(r, g, b);
                    const diff = maxVal - minVal;

                    
                    
                    if (diff < 15) {
                        
                        if (maxVal > 45) {
                            return true;
                        }
                    }
                    return false;
                }

                let head = 0;
                while (head < queue.length) {
                    const x = queue[head++];
                    const y = queue[head++];
                    const idx = (y * width + x) * 4;

                    const r = data[idx];
                    const g = data[idx + 1];
                    const b = data[idx + 2];
                    const a = data[idx + 3];

                    if (isBackground(r, g, b, a)) {
                        data[idx + 3] = 0; 

                        const neighbors = [
                            [x + 1, y], [x - 1, y], [x, y + 1], [x, y - 1]
                        ];
                        for (const [nx, ny] of neighbors) {
                            if (nx >= 0 && nx < width && ny >= 0 && ny < height) {
                                const nidx = ny * width + nx;
                                if (!visited[nidx]) {
                                    visited[nidx] = 1;
                                    queue.push(nx, ny);
                                }
                            }
                        }
                    }
                }

                
                const eraseWidth = Math.ceil(Math.max(50, width * 0.10));
                const eraseHeight = Math.ceil(Math.max(50, height * 0.10));
                for (let y = height - eraseHeight; y < height; y++) {
                    for (let x = width - eraseWidth; x < width; x++) {
                        const idx = (y * width + x) * 4;
                        data[idx + 3] = 0; 
                    }
                }

                ctx.putImageData(imgData, 0, 0);
                const dataUrl = canvas.toDataURL('image/png');
                cachedTransparentSherlock = dataUrl; 
                img.src = dataUrl;
            } catch (e) {
                console.error("Transparentization failed (possibly due to CORS in file:// protocol):", e);
            } finally {
                img.style.opacity = '1'; 
                if (img.id === 'welcome-character' && window.startWelcomeDialogue) {
                    window.startWelcomeDialogue();
                    window.startWelcomeDialogue = null; 
                }
            }
        }

        function applyTheme() {
            const urlParams = new URLSearchParams(window.location.search);
            const theme = urlParams.get('theme');
            if (theme) document.documentElement.setAttribute('data-theme', theme);
        }
        applyTheme();

        
        enableUI(true);

        var unityInstance = null;
        var canvas = document.querySelector("#unity-canvas");
        var config = {
            dataUrl: "Build/knowledge-agent-api.data",
            frameworkUrl: "Build/knowledge-agent-api.framework.js",
            codeUrl: "Build/knowledge-agent-api.wasm",
            streamingAssetsUrl: "StreamingAssets",
            companyName: "DefaultCompany",
            productName: "AgentKnowledgeTest",
            productVersion: "1.0",
        };

        var script = document.createElement("script");
        script.src = "Build/knowledge-agent-api.loader.js";
        script.onload = () => {
            const loadingText = document.getElementById('loading-text');
            const overlay = document.getElementById('loading-overlay');
            const fadeOverlay = document.getElementById('fade-overlay');

            let actualProgress = 0;
            let simulatedProgress = 0;
            let animationFinished = false;

            function updateProgress(p) {
                if (animationFinished) return;
                const displayProgress = Math.min(p, 1);

                
                loadingText.innerText = `3D 引擎載入中... ${Math.round(displayProgress * 100)}% (已啟用極速 API 模式，您可以直接開始對話)`;

                
                if (fadeOverlay) {
                    fadeOverlay.style.opacity = (1 - displayProgress).toString();
                }

                
                if (displayProgress >= 1) {
                    animationFinished = true;
                    clearInterval(progressInterval);

                    setTimeout(() => {
                        if (overlay) {
                            overlay.style.opacity = '0';
                            overlay.style.height = '0';
                            setTimeout(() => { overlay.style.display = 'none'; }, 500);
                        }
                        if (fadeOverlay) {
                            fadeOverlay.style.opacity = '0';
                            setTimeout(() => { fadeOverlay.style.display = 'none'; }, 500);
                        }
                    }, 200);
                }
            }

            
            const intervalMs = 30;
            const step = intervalMs / 3000;
            const progressInterval = setInterval(() => {
                simulatedProgress += step;
                updateProgress(Math.max(simulatedProgress, actualProgress));
            }, intervalMs);

            createUnityInstance(canvas, config, (progress) => {
                actualProgress = progress;
                updateProgress(Math.max(simulatedProgress, actualProgress));
            }).then((instance) => {
                unityInstance = instance;
                instance.SendMessage('_Managers', 'SetCaptureAllKeyboardInput', 0);
                
                actualProgress = 1;
                updateProgress(1);
            }).catch((err) => {
                console.error("Unity 引擎載入失敗，維持 API 模式運作:", err);
                loadingText.innerText = "3D 引擎載入失敗，系統已自動維持極速 API 模式運作！";
                
                actualProgress = 1;
                updateProgress(1);
            });
        };
        document.body.appendChild(script);

        function enableUI(enabled) {
            document.getElementById('userInput').disabled = !enabled;
            document.getElementById('send-btn').disabled = !enabled;
            document.getElementById('clear-btn').disabled = !enabled;
            document.getElementById('s-btn-1').disabled = !enabled;
            document.getElementById('s-btn-2').disabled = !enabled;
            if (enabled) document.getElementById('userInput').placeholder = "請輸入您的問題...";
        }

        function performSend() {
            const input = document.getElementById('userInput');
            const text = input.value.trim();
            if (!text) return;

            appendMsg('user', text);
            input.value = '';
            showTyping(true);

            if (unityInstance) {
                
                setTimeout(() => {
                    unityInstance.SendMessage('_Managers', 'GetMessageFromHTML', text);
                }, 50);
            } else {
                
                fetch('/api/ask', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ query: text })
                })
                    .then(res => {
                        if (!res.ok) throw new Error('API 呼叫失敗');
                        return res.json();
                    })
                    .then(data => {
                        showTyping(false);
                        appendMsg('bot', data.answer);
                    })
                    .catch(err => {
                        showTyping(false);
                        appendMsg('bot', '[系統連線不穩定，請稍後再試]');
                        console.error(err);
                    });
            }
        }

        document.getElementById('userInput').addEventListener('keypress', (e) => { if (e.key === 'Enter') performSend(); });

        function askSuggestion(text) {
            appendMsg('user', text);
            showTyping(true);

            if (unityInstance) {
                
                setTimeout(() => {
                    unityInstance.SendMessage('_Managers', 'GetMessageFromHTML', text);
                }, 50);
            } else {
                
                fetch('/api/ask', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ query: text })
                })
                    .then(res => {
                        if (!res.ok) throw new Error('API 呼叫失敗');
                        return res.json();
                    })
                    .then(data => {
                        showTyping(false);
                        appendMsg('bot', data.answer);
                    })
                    .catch(err => {
                        showTyping(false);
                        appendMsg('bot', '[系統連線不穩定，請稍後再試]');
                        console.error(err);
                    });
            }
        }

        function clearConversation() {
            if (confirm("確定要清空嗎？")) {
                if (unityInstance) unityInstance.SendMessage('_Managers', 'ClearChat');
                location.reload();
            }
        }

        function appendMsg(role, text) {
            if (text === "UNITY_READY") return;
            const win = document.getElementById('chat-window');
            const div = document.createElement('div');
            div.className = `message ${role}-msg cyber-box`;

            if (role === 'bot') {
                const avatar = document.createElement('div');
                avatar.className = 'avatar';
                const avatarImg = document.createElement('img');
                avatarImg.className = 'avatar-img';
                avatarImg.src = 'sherlock.png';
                avatarImg.onload = function () { removeCheckerboard(this); };
                avatar.appendChild(avatarImg);
                const textDiv = document.createElement('div');
                textDiv.className = 'bot-text';
                textDiv.innerText = text;
                div.appendChild(avatar);
                div.appendChild(textDiv);
            } else {
                div.innerText = text;
            }

            win.appendChild(div);
            win.scrollTop = win.scrollHeight;
        }

        let typingTimer = null;
        let dotCount = 0;
        let dotTimer = null;

        function showTyping(isTyping) {
            const win = document.getElementById('chat-window');
            let typingDiv = document.getElementById('typing-indicator');

            if (isTyping) {
                if (!typingDiv) {
                    typingDiv = document.createElement('div');
                    typingDiv.id = 'typing-indicator';
                    typingDiv.className = 'message bot-msg cyber-box';

                    const avatar = document.createElement('div');
                    avatar.className = 'avatar';
                    const avatarImg = document.createElement('img');
                    avatarImg.className = 'avatar-img';
                    avatarImg.src = 'sherlock.png';
                    avatarImg.onload = function() { removeCheckerboard(this); };
                    avatar.appendChild(avatarImg);
                    const textDiv = document.createElement('div');
                    textDiv.className = 'bot-text';
                    textDiv.id = 'typing-text';

                    typingDiv.appendChild(avatar);
                    typingDiv.appendChild(textDiv);
                    win.appendChild(typingDiv);
                }

                const textDiv = document.getElementById('typing-text');
                textDiv.innerText = '機器人正在思考...';
                win.appendChild(typingDiv);
                typingDiv.style.display = 'flex';

                
                if (dotTimer) clearInterval(dotTimer);
                dotCount = 0;
                dotTimer = setInterval(() => {
                    dotCount = (dotCount + 1) % 4;
                    textDiv.innerText = '機器人正在思考' + '.'.repeat(dotCount);
                }, 500);

                if (typingTimer) clearTimeout(typingTimer);

                
                typingTimer = setTimeout(() => {
                    if (typingDiv.style.display === 'flex') {
                        alert("偵測到回應時間較長，系統可能正在排隊或網路不穩，請再耐心等候幾秒或重新整理。");
                    }
                }, 15000);

            } else {
                if (typingTimer) clearTimeout(typingTimer);
                if (dotTimer) clearInterval(dotTimer);
                if (typingDiv) typingDiv.style.display = 'none';
            }
            win.scrollTop = win.scrollHeight;
            
            setTimeout(() => { win.scrollTop = win.scrollHeight; }, 50);
        }

        window.dispatchAnswerToHTML = function (answer) {
            showTyping(false);
            appendMsg('bot', answer);
        };

        window.setTypingStatus = function (isTyping) {
            document.getElementById('send-btn').disabled = (isTyping === 1);
            showTyping(isTyping === 1);
        };

        
        (function () {
            const welcomeTextEl = document.getElementById('welcome-text');
            const welcomeScreenEl = document.getElementById('welcome-screen');
            const sentences = [
                "歡迎使用智能知識助手系統！",
                "我是您的智能助手 Sherlock，很高興為您服務。",
                "系統載入已就緒，請隨時向我提問吧！"
            ];
            let currentSentenceIdx = 0;

            function showNextSentence() {
                if (currentSentenceIdx < sentences.length) {
                    welcomeTextEl.style.opacity = 0;
                    setTimeout(() => {
                        welcomeTextEl.innerText = sentences[currentSentenceIdx];
                        welcomeTextEl.style.transition = 'opacity 0.5s ease';
                        welcomeTextEl.style.opacity = 1;
                        currentSentenceIdx++;
                        
                        setTimeout(showNextSentence, 1800);
                    }, 100);
                } else {
                    
                    setTimeout(() => {
                        welcomeScreenEl.classList.add('hidden');
                    }, 2100);
                }
            }

            
            window.startWelcomeDialogue = function() {
                setTimeout(showNextSentence, 500); 
            };
        })();
    </script>
</body>

</html>
